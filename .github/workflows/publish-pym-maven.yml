name: Publish Pym Maven

on:
  push:
    tags:
      - 'pym-v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pym-maven-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check release version
        shell: bash
        run: |
          version="$(sed -n 's/^pym_mod_version=//p' gradle.properties | tr -d '\r')"
          if [[ -z "$version" ]]; then
            echo "Missing pym_mod_version"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "pym-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Pym version ${version}"
            exit 1
          fi

      - name: Restore published versions
        shell: bash
        run: |
          mkdir -p build/maven-repo
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git archive FETCH_HEAD | tar -x -C build/maven-repo
          fi

      - name: Publish Pym to Maven directory
        run: ./gradlew :pym:publishPymPublicationToPagesRepository --no-daemon --stacktrace

      - name: Prepare Pages
        run: |
          touch build/maven-repo/.nojekyll
          printf '<!doctype html><title>Pym Maven Repository</title><h1>Pym Maven Repository</h1>\n' > build/maven-repo/index.html

      - name: Preserve Maven releases in gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/maven-repo
          keep_files: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/maven-repo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
