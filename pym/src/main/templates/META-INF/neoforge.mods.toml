modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="misterblusky9"
description='''
Arbitrary-scale runtime for Sable sublevels: scale state, persistence, sync, scaled physics,
collision and world interaction, so a resized sublevel keeps behaving like part of the world.
'''

[[mixins]]
config="pym.mixins.json"

# Compat modules. Each one only applies when its mod is installed.
[[mixins]]
config="pym.create.mixins.json"

[[mixins]]
config="pym.simulated.mixins.json"

[[mixins]]
config="pym.simulatedcoasters.mixins.json"

[[mixins]]
config="pym.aeronautics.mixins.json"

[[mixins]]
config="pym.offroad.mixins.json"

[[mixins]]
config="pym.createbigcannons.mixins.json"

[[mixins]]
config="pym.pehkui.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.0,2.1)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pehkui"
type="optional"
versionRange="[3.8.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0.10,6.1)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulated"
type="optional"
versionRange="[1.3.0,1.4)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulatedcoasters"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="optional"
versionRange="[1.3.0,1.4)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="offroad"
type="optional"
versionRange="[1.3.0,1.4)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="createbigcannons"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
