modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="misterblusky9"
description='''
Arbitrary-scale runtime for Sable sublevels: scale state, persistence, sync, scaled physics,
collision and world interaction, so a resized sublevel keeps behaving like part of the world.
'''

[[mixins]]
config="pym.mixins.json"

[[mixins]]
config="pym.create.mixins.json"

[[mixins]]
config="pym.simulated.mixins.json"

[[mixins]]
config="pym.simulatedcoasters.mixins.json"

[[mixins]]
config="pym.simurail.mixins.json"

[[mixins]]
config="pym.aeronautics_utility_objects.mixins.json"

[[mixins]]
config="pym.aeronautics.mixins.json"

[[mixins]]
config="pym.aeroworks.mixins.json"

[[mixins]]
config="pym.offroad.mixins.json"

[[mixins]]
config="pym.tracks.mixins.json"

[[mixins]]
config="pym.aero_no_horizon.mixins.json"

[[mixins]]
config="pym.createbigcannons.mixins.json"

[[mixins]]
config="pym.pehkui.mixins.json"

[[mixins]]
config="pym.ponder.mixins.json"

[[dependencies.${mod_id}]]
