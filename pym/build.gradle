plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = pym_mod_version
group = pym_mod_group_id

base {
    archivesName = pym_mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    aeronauticsBundle
}

tasks.register('extractSimulated', Copy) {
    from({ zipTree(configurations.aeronauticsBundle.singleFile) }) {
        include 'META-INF/jarjar/dev.simulated_team.simulated.*.jar'
    }
    into layout.buildDirectory.dir('simulated')
    eachFile { it.path = it.name }
    includeEmptyDirs = false
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = rootProject.file("runs/pym-gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', pym_mod_id
        }
    }

    mods {
        "${pym_mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gametest
}

dependencies {
    implementation "maven.modrinth:T9PomCSv:NGuyFOeE"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    testRuntimeOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    compileOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"
    gametestRuntimeOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    aeronauticsBundle "maven.modrinth:oWaK0Q19:w7zlLnea"
    compileOnly fileTree(dir: layout.buildDirectory.dir('simulated'), include: '*.jar')
            .builtBy('extractSimulated')

    testImplementation "org.joml:joml:${joml_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : pym_mod_id,
            mod_name                : pym_mod_name,
            mod_license             : pym_mod_license,
            mod_version             : pym_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def contractTest(String name, String description, String mainClass) {
    tasks.register(name, JavaExec) {
        group = 'verification'
        it.description = description
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        it.mainClass = mainClass
    }
    tasks.named('check') { dependsOn tasks.named(name) }
}

contractTest('scaleContractTest',
        'Runs the scale-validity, snapping, bounds and legacy-migration checks.',
        'com.misterblusky9.pym.internal.scale.ScaleContractTest')
contractTest('scaleTransitionTest',
        'Runs repeated scaled-collider transition sound-effect suppression checks.',
        'com.misterblusky9.pym.internal.physics.ScaledRebuildCollisionEffectFilterTest')
contractTest('colliderBudgetTest',
        'Runs the collider complexity-budget and prism-shell checks.',
        'com.misterblusky9.pym.internal.physics.ColliderBudgetTest')
contractTest('expansionClearanceBudgetTest',
        'Runs the expansion-clearance displacement allowance checks.',
        'com.misterblusky9.pym.internal.physics.ExpansionClearanceBudgetTest')
contractTest('genericConstraintStateTest',
        'Checks moving constraint frames and limit replay across scale changes.',
        'com.misterblusky9.pym.internal.physics.GenericConstraintStateTest')
contractTest('mergedCouplingGraphTest',
        'Checks that several coupling providers merge into one graph.',
        'com.misterblusky9.pym.internal.extension.MergedCouplingGraphTest')
contractTest('surfaceNormalTest',
        'Runs the Create Big Cannons scaled surface-normal checks.',
        'com.misterblusky9.pym.internal.compat.createbigcannons.ScaledSurfaceNormalTest')
contractTest('pocketIndependenceTest',
        'Checks that Pym never depends on Create: Pocket Sized.',
        'com.misterblusky9.pym.PocketIndependenceTest')
tasks.named('pocketIndependenceTest', JavaExec) {
    workingDir = project.projectDir
    inputs.dir('src/main')
}
