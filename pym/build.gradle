plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = pym_mod_version
group = pym_mod_group_id

base {
    archivesName = pym_mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    createtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    createtestImplementation.extendsFrom implementation
    createtestCompileOnly.extendsFrom compileOnly
    aeronauticsBundle
}

tasks.register('extractSimulated', Copy) {
    from({ zipTree(configurations.aeronauticsBundle.singleFile) }) {
        include 'META-INF/jarjar/dev.simulated_team.simulated.*.jar'
    }
    into layout.buildDirectory.dir('simulated')
    eachFile { it.path = it.name }
    includeEmptyDirs = false
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${pym_mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
        pym_create {
            sourceSet(sourceSets.createtest)
        }
    }

    runs {
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = rootProject.file("runs/pym-gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', pym_mod_id
            loadedMods = [mods.getByName(pym_mod_id)]
        }
        createGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.createtest
            gameDirectory = rootProject.file("runs/pym-gametest-create")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pym_create'
            loadedMods = [mods.getByName(pym_mod_id), mods.getByName('pym_create')]
        }
    }

    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.createtest
}

dependencies {
    implementation "maven.modrinth:T9PomCSv:NGuyFOeE"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    compileOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"
    gametestRuntimeOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"
    createtestRuntimeOnly "maven.modrinth:t5W7Jfwy:nKHizsl6"
    createtestRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    createtestRuntimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    createtestRuntimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    createtestRuntimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "maven.modrinth:hNGBYvQN:hwxjOCxE"

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    aeronauticsBundle "maven.modrinth:oWaK0Q19:w7zlLnea"
    compileOnly fileTree(dir: layout.buildDirectory.dir('simulated'), include: '*.jar')
            .builtBy('extractSimulated')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : pym_mod_id,
            mod_name                : pym_mod_name,
            mod_license             : pym_mod_license,
            mod_version             : pym_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE.md'))
}
